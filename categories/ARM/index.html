<script>
(function () {
  'use strict';

  /* ---------- helpers ---------- */
  function $(sel) { return document.querySelector(sel); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  var isHome = /^\/(index\.html?)?$/.test(location.pathname);

  /* ---------- status bar clock ---------- */
  var timeEl = $('.ts-time');
  if (timeEl) {
    function tick() {
      var d = new Date();
      timeEl.textContent = [d.getHours(), d.getMinutes(), d.getSeconds()]
        .map(function (n) { return String(n).padStart(2, '0'); }).join(':');
    }
    tick();
    setInterval(tick, 1000);
  }

  if (!isHome) return;

  /* ---------- terminal hero ---------- */
  var LINES = [
    { cmd: 'whoami', out: 'D.riven — Embedded Engineer' },
    { cmd: 'cat skills.txt', out: 'C/C++ · Python · Embedded · SDR · Linux' },
    { cmd: 'ls blog/ --tech', out: '#SDR  #CPP  #gnuradio  #Linux  #ARM', cls: 'dim' },
    { cmd: './launch_blog.sh', out: '[OK] signal acquired · posts on air', cls: 'ok' }
  ];

  function typeText(el, text) {
    return new Promise(function (resolve) {
      var i = 0;
      (function tick() {
        el.textContent = text.slice(0, i);
        if (i++ <= text.length) setTimeout(tick, 34 + Math.random() * 52);
        else resolve();
      })();
    });
  }

  function mount() {
    var hero = document.getElementById('driven-hero');
    if (!hero) return;

    var win = document.createElement('div');
    win.className = 'term-window';

    var bar = document.createElement('div');
    bar.className = 'term-titlebar';
    bar.innerHTML = '<span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>'
      + '<span class="term-title">driven@blog: ~/D.riven — bash</span>';

    var body = document.createElement('div');
    body.className = 'term-body';

    var scope = document.createElement('div');
    scope.className = 'scope-wrap';
    scope.innerHTML = '<canvas id="scope-canvas"></canvas>';

    win.appendChild(bar);
    win.appendChild(body);
    hero.appendChild(win);
    hero.appendChild(scope);

    var container = $('.main-inner') || document.body;
    container.insertBefore(hero, container.firstChild);

    /* typewriter */
    (async function runTerminal() {
      var cur = document.createElement('p');
      cur.className = 'term-line';
      var pr = document.createElement('span'); pr.className = 'prompt'; pr.textContent = '$ ';
      var tg = document.createElement('span'); tg.className = 'type-target';
      var bk = document.createElement('span'); bk.className = 'cursor-block'; bk.textContent = '\u258B';
      cur.appendChild(pr); cur.appendChild(tg); cur.appendChild(bk);
      body.appendChild(cur);

      for (var i = 0; i < LINES.length; i++) {
        await typeText(tg, LINES[i].cmd);
        await sleep(240);
        var out = document.createElement('p');
        out.className = 'term-line out' + (LINES[i].cls ? ' ' + LINES[i].cls : '');
        out.textContent = LINES[i].out;
        body.insertBefore(out, cur);
        await sleep(180);
        tg.textContent = '';
      }
      body.classList.add('done');
    })();

    /* oscilloscope */
    var canvas = document.getElementById('scope-canvas');
    var ctx = canvas.getContext('2d');
    var W = 0, H = 0, dpr = 1, phase = 0;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.clientWidth; H = canvas.clientHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
    else window.addEventListener('resize', resize);

    function yAt(x) {
      var p = x / W * Math.PI * 7 + phase;
      return H / 2
        + Math.sin(p) * H * 0.22
        + Math.sin(p * 0.41 + 1.7) * H * 0.10
        + Math.sin(p * 0.13 + 4.2) * H * 0.05;
    }

    (function frame() {
      ctx.clearRect(0, 0, W, H);
      /* graticule */
      ctx.strokeStyle = 'rgba(0,255,136,0.07)';
      ctx.lineWidth = 1;
      var gx = W / 14, gy = H / 5;
      ctx.beginPath();
      for (var x = 0; x <= W; x += gx) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
      for (var y = 0; y <= H; y += gy) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
      ctx.stroke();
      /* waveform */
      ctx.strokeStyle = 'rgba(0,255,136,0.85)';
      ctx.shadowColor = 'rgba(0,255,136,0.7)';
      ctx.shadowBlur = 10;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (var px = 0; px <= W; px += 2) {
        var py = yAt(px);
        if (px === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
      /* sweep head */
      var sweep = ((phase % (Math.PI * 2)) / (Math.PI * 2)) * W;
      var sy = yAt(sweep);
      ctx.fillStyle = '#d7ffe6';
      ctx.beginPath(); ctx.arc(sweep, sy, 2.5, 0, Math.PI * 2); ctx.fill();
      phase += 0.055;
      requestAnimationFrame(frame);
    })();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();
})();
</script>
